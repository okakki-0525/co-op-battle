<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>秘密の管理ページ</title>
<style>
body{
    background:#202830;
    color:white;
    font-family:sans-serif;
    padding:20px;
}
.container{
    max-width:900px;
    margin:auto;
}
.card{
    background:rgba(255,255,255,0.08);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
}
h1{
    color:#ffd700;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border-bottom:1px solid rgba(255,255,255,0.15);
    padding:8px;
    text-align:left;
}
.today{
    color:#7CFC98;
    font-weight:bold;
}
.back{
    display:inline-block;
    margin-top:20px;
    color:#ffd54f;
}
</style>
</head>
<body>
<div class="container">

<h1>秘密の管理ページ</h1>

<div class="card">
    <p>総登録者数：<b>{{ total_players }}</b> 人</p>
    <p>今日ログインした人数：<b>{{ today_login_count }}</b> 人</p>
</div>

<div class="card">
    <h2>最近ログインした人</h2>

    <table>
        <tr>
            <th>プレイヤー</th>
            <th>登録日</th>
            <th>最終ログイン</th>
            <th>ログイン回数</th>
        </tr>

        {% for p in players_info %}
        <tr>
            <td>
                {{ p.player_id }}
                {% if p.is_today %}
                    <span class="today">今日来た！</span>
                {% endif %}
            </td>
            <td>{{ p.created_at_text }}</td>
            <td>{{ p.last_login }}</td>
            <td>{{ p.login_count }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

<a class="back" href="/">ロビーへ戻る</a>

</div>
</body>
</html>
